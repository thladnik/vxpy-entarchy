[build-system]
# 77 is the first setuptools that reads the SPDX `license` string below
requires      = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vxentarchy"
version = "0.1.0"
description = "Entarchy schema and ingest for vxpy recordings and suite2p output"
readme = "README.md"
authors = [{ name = 'Tim Hladnik', email = "contact@vxpy.org" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
        'Development Status :: 3 - Alpha',
        'Intended Audience :: Science/Research',
        'Operating System :: POSIX :: Linux',
        'Operating System :: Microsoft :: Windows',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Topic :: Scientific/Engineering',
        'Topic :: Scientific/Engineering :: Information Analysis',
]
keywords = ['neuroscience', 'vxpy', 'suite2p', 'data analysis', 'two-photon microscopy']
dependencies = [
    'entarchy>=0.2.0',
    'h5py',
    'numpy',
    'pandas',
    'pyyaml',
    'scipy',
    'tables',
    'tifffile',
    'tqdm'
]
requires-python = ">=3.10"

[project.optional-dependencies]
cmn = [
    'matplotlib',
    'quaternionic',
    'scipy',
    'torch',
]
# Running the example notebooks, and the test that executes them
examples = [
    'matplotlib',
    'nbclient',
    'nbformat',
    'ipykernel',
    'asdf',
]
dev = [
    'pytest',
    'build',
    'twine',
    'matplotlib',
    'nbclient',
    'nbformat',
    'ipykernel',
    'asdf',
]

[project.scripts]
vxentarchy = 'vxentarchy.cli:main'

[tool.setuptools.packages.find]
where = ['.']
include = ['vxentarchy*']

[project.urls]
Homepage = 'https://github.com/thladnik/vxpy-entarchy'
Repository = 'https://github.com/thladnik/vxpy-entarchy'
Issues = 'https://github.com/thladnik/vxpy-entarchy/issues'

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['slow: tests that execute notebooks or spawn subprocess workers']
filterwarnings = ['ignore::DeprecationWarning:tifffile.*']
